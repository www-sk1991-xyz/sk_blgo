<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="技术博客 - 分享编程、AI和开发相关知识">
    <title>我的技术博客</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-theme.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-text">Tech Blog</span>
            </a>
            <button class="nav-toggle" aria-label="切换导航菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">首页</a></li>
                <li><a href="about.html" class="nav-link">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="main-content">
        <div class="container">
            <!-- 页面标题 -->
            <header class="page-header">
                <h1 class="page-title">最新文章</h1>
                <p class="page-subtitle">分享编程、AI和开发的相关知识</p>
            </header>

            <!-- 文章列表容器 -->
            <div id="posts-container" class="posts-container">
                <!-- 文章将通过JavaScript动态加载 -->
                <div class="loading">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2024 我的技术博客. All rights reserved.</p>
                <p class="footer-links">
                    <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <span class="separator">•</span>
                    <a href="mailto:your.email@example.com">邮箱联系</a>
                </p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
