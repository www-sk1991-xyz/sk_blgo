<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="文章详情">
    <title id="page-title">文章详情 - 我的技术博客</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-theme.css">
    <link rel="stylesheet" href="css/markdown.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-text">Tech Blog</span>
            </a>
            <button class="nav-toggle" aria-label="切换导航菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="about.html" class="nav-link">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="main-content">
        <article class="post-article">
            <div class="container">
                <!-- 返回按钮 -->
                <a href="index.html" class="back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    返回文章列表
                </a>

                <!-- 文章标题区 -->
                <header class="post-header">
                    <h1 id="post-title" class="post-title">加载中...</h1>
                    <div class="post-meta">
                        <time id="post-date" class="post-date"></time>
                        <span class="separator">•</span>
                        <span id="post-reading-time" class="post-reading-time"></span>
                        <div id="post-tags" class="post-tags"></div>
                    </div>
                </header>

                <!-- 文章内容 -->
                <div id="post-content" class="post-content">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>加载文章中...</p>
                    </div>
                </div>

                <!-- 文章导航 -->
                <nav class="post-navigation">
                    <a href="#" id="prev-post" class="nav-btn prev-post" style="visibility: hidden;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <div class="nav-btn-content">
                            <span class="nav-label">上一篇</span>
                            <span id="prev-post-title" class="nav-title"></span>
                        </div>
                    </a>
                    <a href="#" id="next-post" class="nav-btn next-post" style="visibility: hidden;">
                        <div class="nav-btn-content">
                            <span class="nav-label">下一篇</span>
                            <span id="next-post-title" class="nav-title"></span>
                        </div>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </a>
                </nav>
            </div>
        </article>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2024 我的技术博客. All rights reserved.</p>
                <p class="footer-links">
                    <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
                    <span class="separator">•</span>
                    <a href="mailto:your.email@example.com">邮箱联系</a>
                </p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/posts.js"></script>
    <script>
        // 初始化代码高亮
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        // 页面加载完成后渲染文章
        document.addEventListener('DOMContentLoaded', () => {
            loadPostContent();
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
